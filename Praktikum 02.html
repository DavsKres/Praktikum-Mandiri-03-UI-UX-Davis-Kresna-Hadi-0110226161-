<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pemesanan Barang</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border: 2px solid #333;
  }

  /* ===== Menu (hanya pajangan, tanpa link) ===== */
  .menu {
    display: flex;
    flex-wrap: wrap;
    margin: 20px;
    border: 2px solid #333;
    background: #fff;
  }
  .menu span {
    flex: 1;
    text-align: center;
    padding: 8px 10px;
    font-size: 14px;
    border-right: 1px solid #333;
    cursor: default;
    user-select: none;
  }
  .menu span:last-child { border-right: none; }

  /* ===== Form ===== */
  form { padding: 10px 30px 30px; }
  .layout { display: flex; gap: 30px; flex-wrap: wrap; }

  .left { width: 240px; }
  .right { flex: 1; min-width: 300px; }

  /* Kotak foto */
  .photo-box {
    width: 240px;
    height: 240px;
    border: 2px solid #333;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(to top right, transparent calc(50% - 1px), #333 50%, transparent calc(50% + 1px)),
      linear-gradient(to top left,  transparent calc(50% - 1px), #333 50%, transparent calc(50% + 1px)),
      #fff;
  }
  .photo-box.has-image { background: #fff; }
  .photo-box img {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: cover;   /* foto otomatis pas di dalam kotak */
  }
  .photo-box.has-image img { display: block; }

  .btn-upload {
    margin-top: 12px;
    padding: 6px 14px;
    border: 2px solid #333;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #333;
  }
  .btn-upload:hover { background: #f1f1f1; }
  #fileName { display: block; margin-top: 8px; font-size: 12px; color: #555; word-break: break-all; }
  #photoError { display: block; margin-top: 6px; font-size: 12px; color: #c00; }

  /* Baris form */
  .row { display: flex; align-items: flex-start; margin-bottom: 14px; }
  .row label.lbl {
    width: 150px;
    font-size: 13px;
    padding-top: 7px;
    flex-shrink: 0;
  }
  .row .field { flex: 1; }

  input[type="text"], input[type="number"], input[type="email"], select, textarea {
    width: 100%;
    padding: 7px 8px;
    border: 2px solid #333;
    font-size: 13px;
    background: #fff;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 110px; }
  input[type="number"] { width: 90px; }

  .note { font-size: 11px; color: #555; margin-top: 4px; }
  .checks label { display: block; font-size: 13px; margin-bottom: 4px; color: #1a7f37; }
  .checks input { margin-right: 6px; }

  /* Pembayaran */
  .pay-detail { display: none; }
  .pay-detail.show { display: block; }
  .qris-box {
    width: 160px; height: 160px;
    border: 2px dashed #333;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 13px; background: #fafafa;
  }
  .cash-info {
    font-size: 13px; padding: 10px; border: 2px solid #333; background: #fafafa;
  }

  /* Tombol kirim */
  .btn-submit {
    margin-top: 10px;
    padding: 9px 22px;
    background: #22aa44;
    color: #fff;
    border: 2px solid #111;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #111;
  }
  .btn-submit:hover { background: #1c8f39; }

  #result {
    display: none;
    margin-top: 20px;
    padding: 12px 15px;
    border: 2px solid #1a7f37;
    background: #eaf7ee;
    font-size: 13px;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .left { width: 100%; }
    .photo-box { width: 100%; height: 260px; }
    .row { flex-direction: column; }
    .row label.lbl { width: 100%; padding-top: 0; margin-bottom: 4px; }
    .row .field { width: 100%; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- Menu pajangan: 5 item, bukan link -->
  <div class="menu">
    <span>Home</span>
    <span>Generate Link</span>
    <span>Transaction History</span>
    <span>Policy</span>
    <span>Logout</span>
  </div>

  <form id="orderForm" novalidate>
    <div class="layout">

      <!-- Kolom kiri: foto -->
      <div class="left">
        <div class="photo-box" id="photoBox">
          <img id="preview" alt="Pratinjau foto barang">
        </div>
        <input type="file" id="photo" accept="image/*" hidden>
        <button type="button" class="btn-upload" id="btnUpload">Upload Picture</button>
        <span id="fileName"></span>
        <span id="photoError"></span>
      </div>

      <!-- Kolom kanan: data barang -->
      <div class="right">

        <div class="row">
          <label class="lbl" for="title">Title Here :</label>
          <div class="field">
            <input type="text" id="title" placeholder="Contoh: MacBook Air Rp15.000.000">
          </div>
        </div>

        <div class="row">
          <label class="lbl" for="desc">Description :</label>
          <div class="field">
            <textarea id="desc" placeholder="Year :&#10;Model :&#10;Condition :"></textarea>
          </div>
        </div>

        <div class="row">
          <label class="lbl" for="payment">Pembayaran :</label>
          <div class="field">
            <select id="payment">
              <option value="">-- Pilih metode pembayaran --</option>
              <option value="bank">Bank</option>
              <option value="qris">QRIS</option>
              <option value="cash">Cash</option>
            </select>
          </div>
        </div>

        <!-- Detail jika Bank -->
        <div class="pay-detail" id="detail-bank">
          <div class="row">
            <label class="lbl" for="bank">Bank :</label>
            <div class="field">
              <select id="bank">
                <option value="">-- Pilih bank --</option>
                <option>BCA</option>
                <option>BRI</option>
                <option>BNI</option>
                <option>Mandiri</option>
                <option>BSI</option>
              </select>
            </div>
          </div>
          <div class="row">
            <label class="lbl" for="accNumber">Account Number :</label>
            <div class="field">
              <input type="text" id="accNumber" inputmode="numeric" placeholder="Contoh: 1234567890">
            </div>
          </div>
          <div class="row">
            <label class="lbl" for="accHolder">Account Holder :</label>
            <div class="field">
              <input type="text" id="accHolder" placeholder="Nama pemilik rekening">
            </div>
          </div>
        </div>

        <!-- Detail jika QRIS -->
        <div class="pay-detail" id="detail-qris">
          <div class="row">
            <label class="lbl">QRIS :</label>
            <div class="field">
              <div class="qris-box">Area QR Code<br>QRIS</div>
              <div class="note">Scan kode QR untuk membayar.</div>
            </div>
          </div>
        </div>

        <!-- Detail jika Cash -->
        <div class="pay-detail" id="detail-cash">
          <div class="row">
            <label class="lbl">Cash :</label>
            <div class="field">
              <div class="cash-info">Pembayaran dilakukan secara tunai saat barang diterima.</div>
            </div>
          </div>
        </div>

        <div class="row">
          <label class="lbl" for="transaction">Transaction :</label>
          <div class="field">
            <input type="number" id="transaction" min="1" max="5" value="1">
            <div class="note">* Jumlah transaksi maksimal 5.</div>
          </div>
        </div>

        <div class="row">
          <label class="lbl"></label>
          <div class="field checks">
            <label><input type="checkbox" id="chkPhone" checked>Send to Mobile Phone</label>
            <label><input type="checkbox" id="chkEmail" checked>Send to Email</label>
          </div>
        </div>

        <div class="row" id="rowPhone">
          <label class="lbl" for="phone">Send to Mobile Phone :</label>
          <div class="field">
            <input type="text" id="phone" placeholder="08123456789, 08123456780">
          </div>
        </div>

        <div class="row" id="rowEmail">
          <label class="lbl" for="email">Send to Email :</label>
          <div class="field">
            <input type="text" id="email" placeholder="nama@email.com, nama2@email.com">
          </div>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesanan</button>
      </div>
    </div>

    <div id="result"></div>
  </form>
</div>

<script>
  // ===== Upload foto + pratinjau di dalam kotak =====
  const photoInput = document.getElementById('photo');
  const photoBox   = document.getElementById('photoBox');
  const preview    = document.getElementById('preview');
  const fileName   = document.getElementById('fileName');
  const photoError = document.getElementById('photoError');
  const MAX_SIZE   = 5 * 1024 * 1024; // 5 MB

  document.getElementById('btnUpload').addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    photoError.textContent = '';
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      photoError.textContent = 'File harus berupa gambar.';
      photoInput.value = '';
      return;
    }
    if (file.size > MAX_SIZE) {
      photoError.textContent = 'Ukuran foto maksimal 5 MB.';
      photoInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      photoBox.classList.add('has-image');
      fileName.textContent = file.name;
    };
    reader.readAsDataURL(file);
  });

  // ===== Metode pembayaran =====
  const payment = document.getElementById('payment');
  payment.addEventListener('change', () => {
    ['bank', 'qris', 'cash'].forEach(m => {
      document.getElementById('detail-' + m).classList.toggle('show', payment.value === m);
    });
  });

  // ===== Transaksi maksimal 5 =====
  const trx = document.getElementById('transaction');
  function clampTrx() {
    let v = parseInt(trx.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 5) v = 5;
    trx.value = v;
  }
  trx.addEventListener('input', () => {
    if (trx.value !== '' && parseInt(trx.value, 10) > 5) trx.value = 5;
  });
  trx.addEventListener('blur', clampTrx);

  // ===== Checkbox kirim ke HP / Email =====
  document.getElementById('chkPhone').addEventListener('change', e => {
    document.getElementById('rowPhone').style.display = e.target.checked ? 'flex' : 'none';
  });
  document.getElementById('chkEmail').addEventListener('change', e => {
    document.getElementById('rowEmail').style.display = e.target.checked ? 'flex' : 'none';
  });

  // ===== Submit =====
  document.getElementById('orderForm').addEventListener('submit', (e) => {
    e.preventDefault();
    clampTrx();

    const errors = [];
    if (!document.getElementById('title').value.trim()) errors.push('Title wajib diisi.');
    if (!payment.value) errors.push('Pilih metode pembayaran.');
    if (payment.value === 'bank') {
      if (!document.getElementById('bank').value) errors.push('Pilih bank.');
      if (!document.getElementById('accNumber').value.trim()) errors.push('Account Number wajib diisi.');
      if (!document.getElementById('accHolder').value.trim()) errors.push('Account Holder wajib diisi.');
    }

    const result = document.getElementById('result');
    result.style.display = 'block';

    if (errors.length) {
      result.style.borderColor = '#c00';
      result.style.background = '#fdecec';
      result.innerHTML = '<b>Periksa kembali:</b><br>• ' + errors.join('<br>• ');
      return;
    }

    result.style.borderColor = '#1a7f37';
    result.style.background = '#eaf7ee';
    result.innerHTML =
      '<b>Pesanan berhasil dikirim!</b><br>' +
      'Barang: ' + document.getElementById('title').value + '<br>' +
      'Pembayaran: ' + payment.options[payment.selectedIndex].text + '<br>' +
      'Jumlah transaksi: ' + trx.value;
  });
</script>



</body>
</html>
